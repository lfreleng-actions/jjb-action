---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  test-mode:
    name: "Test mode"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The publisher cannot commit a symlink, so link global-jjb into
      # the tree here, the way ci-management repositories link their
      # global-jjb submodule.
      - name: "Link global-jjb into the fixture"
        shell: bash
        run: |
          # Link global-jjb into the fixture
          ln -s ../global-jjb/jjb tests/fixtures/ci-management/jjb/global-jjb

      - name: "Generate the fixture's jobs"
        id: fixture
        uses: $/
        with:
          mode: test
          path_prefix: tests/fixtures/ci-management
          jjb_path: jjb

      - name: "Check the generated jobs"
        shell: bash
        env:
          JOB_COUNT: ${{ steps.fixture.outputs.job_count }}
          OUTPUT_DIR: ${{ steps.fixture.outputs.output_dir }}
        run: |
          # Check the generated jobs
          if [ "$JOB_COUNT" != 2 ]; then
            echo "::error::job_count is '$JOB_COUNT', expected 2"
            exit 1
          fi
          case $OUTPUT_DIR in
            "$RUNNER_TEMP"/*) ;;
            *) echo "::error::output_dir is not under RUNNER_TEMP"; exit 1 ;;
          esac
          diff -r --exclude='*.license' tests/expected/ci-management \
            "$OUTPUT_DIR"
          echo "Generated XML matches the expected jobs ✅"

      - name: "Check no ini file is left behind"
        shell: bash
        run: |
          # Check no ini file is left behind
          left=$(find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" \
            -name jenkins_jobs.ini -print)
          if [ -n "$left" ]; then
            echo "::error::jenkins_jobs.ini left behind: $left"
            exit 1
          fi
          echo "No ini file left behind ✅"

      - name: "Check JJB reads the ini values back unchanged"
        shell: bash
        run: |
          # Check JJB reads the ini values back unchanged
          bash tests/ini-roundtrip.sh "$RUNNER_TEMP/jjb-action-venv"

      - name: "Generate a malformed tree [expected failure]"
        id: malformed
        continue-on-error: true
        uses: $/
        with:
          path_prefix: tests/fixtures/malformed

      - name: "Remove the global-jjb link"
        shell: bash
        run: |
          # Remove the global-jjb link
          rm tests/fixtures/ci-management/jjb/global-jjb

      # Without the link the project names templates JJB cannot find,
      # which shows the link was followed above.
      - name: "Generate without global-jjb [expected failure]"
        id: unlinked
        continue-on-error: true
        uses: $/
        with:
          path_prefix: tests/fixtures/ci-management

      - name: "Check the expected failures failed"
        shell: bash
        env:
          MALFORMED: ${{ steps.malformed.outcome }}
          UNLINKED: ${{ steps.unlinked.outcome }}
        run: |
          # Check the expected failures failed
          if [ "$MALFORMED" != failure ] || [ "$UNLINKED" != failure ]; then
            echo "::error::A tree JJB cannot expand did not fail"
            exit 1
          fi
          echo "Broken trees fail ✅"

  update-mode:
    name: "Update mode"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      # Nothing listens here, so the update fails at its first request
      # without a DNS lookup or any traffic leaving the runner.
      UNREACHABLE_URL: "https://127.0.0.1:9"
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Link global-jjb into the fixture"
        shell: bash
        run: |
          # Link global-jjb into the fixture
          ln -s ../global-jjb/jjb tests/fixtures/ci-management/jjb/global-jjb

      - name: "Check valid Jenkins URLs pass validation"
        shell: bash
        env:
          INPUT_MODE: update
          INPUT_PATH_PREFIX: tests/fixtures/no-jobs
          INPUT_JJB_PATH: jjb
          INPUT_JENKINS_USER: jjb
          INPUT_JENKINS_PASSWORD: "not-a-secret"
          INPUT_DELETE_OLD: "true"
          INPUT_WORKERS: "0"
        run: |
          # Check valid Jenkins URLs pass validation
          for url in \
            'https://jenkins.example.org' \
            'https://jenkins.example.org:8443/ci%20path/?a=1#top' \
            'https://127.0.0.1:9'; do
            if ! INPUT_JENKINS_URL=$url bash scripts/validate.sh; then
              echo "::error::validate.sh rejected $url"
              exit 1
            fi
          done

      # Without delete_old an empty tree is allowed, and with no jobs to
      # push JJB never contacts Jenkins: this passes against the same
      # unreachable URL. The next step differs only in delete_old, so
      # its failure is the refusal, not the network.
      - name: "Update with an empty tree and no delete_old"
        id: empty-keep
        uses: $/
        with:
          mode: update
          path_prefix: tests/fixtures/no-jobs
          jenkins_url: ${{ env.UNREACHABLE_URL }}
          jenkins_user: "jjb"
          jenkins_password: "not-a-secret"
          delete_old: false

      - name: "Update with an empty tree and delete_old [expected failure]"
        id: empty-delete
        continue-on-error: true
        uses: $/
        with:
          mode: update
          path_prefix: tests/fixtures/no-jobs
          jenkins_url: ${{ env.UNREACHABLE_URL }}
          jenkins_user: "jjb"
          jenkins_password: "not-a-secret"
          delete_old: true

      - name: "Update an unreachable Jenkins [expected failure]"
        id: unreachable
        continue-on-error: true
        uses: $/
        with:
          mode: update
          path_prefix: tests/fixtures/ci-management
          jenkins_url: ${{ env.UNREACHABLE_URL }}
          jenkins_user: "jjb"
          jenkins_password: "not-a-secret"
          workers: 2

      - name: "Check the update results"
        shell: bash
        env:
          EMPTY_KEEP_COUNT: ${{ steps.empty-keep.outputs.job_count }}
          EMPTY_DELETE: ${{ steps.empty-delete.outcome }}
          UNREACHABLE: ${{ steps.unreachable.outcome }}
        run: |
          # Check the update results
          if [ "$EMPTY_KEEP_COUNT" != 0 ]; then
            echo "::error::Empty tree reported '$EMPTY_KEEP_COUNT' jobs"
            exit 1
          fi
          if [ "$EMPTY_DELETE" != failure ]; then
            echo "::error::An empty tree with delete_old was not refused"
            exit 1
          fi
          if [ "$UNREACHABLE" != failure ]; then
            echo "::error::Updating an unreachable Jenkins did not fail"
            exit 1
          fi
          left=$(find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" \
            -name jenkins_jobs.ini -print)
          if [ -n "$left" ]; then
            echo "::error::jenkins_jobs.ini left behind: $left"
            exit 1
          fi
          echo "Update mode refuses and cleans up ✅"

  rejections:
    name: "Reject ${{ matrix.case }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Every rejected value carries S3ntinel, or is named in 'leak',
        # so the log can be checked for an echoed value.
        include:
          - case: "unknown mode"
            mode: "deploy-S3ntinel"
          - case: "absolute path_prefix"
            path_prefix: "/tmp/S3ntinel"
          - case: "path_prefix with '..'"
            path_prefix: "tests/../S3ntinel"
          - case: "path_prefix with leading '-'"
            path_prefix: "-S3ntinel"
          - case: "path_prefix with whitespace"
            path_prefix: "tests/S3ntinel dir"
          - case: "path_prefix with a non-breaking space"
            path_prefix: "tests/S3ntinel\u00a0dir"
          - case: "path_prefix with a control character"
            path_prefix: "tests/S3ntinel\x01"
          - case: "missing path_prefix directory"
            path_prefix: "tests/S3ntinel"
          - case: "absolute jjb_path"
            jjb_path: "/S3ntinel"
          - case: "jjb_path with '..'"
            jjb_path: "../S3ntinel"
          - case: "jjb_path with leading '-'"
            jjb_path: "--S3ntinel"
          - case: "jjb_path with a new line"
            jjb_path: "jjb\nS3ntinel"
          - case: "jjb_path with a tab"
            jjb_path: "jjb\tS3ntinel"
          - case: "missing jjb_path directory"
            jjb_path: "S3ntinel"
          - case: "invalid delete_old"
            delete_old: "yes-S3ntinel"
          - case: "non-numeric workers"
            workers: "S3ntinel"
          - case: "negative workers"
            workers: "-1"
            leak: "-1"
          - case: "workers above 64"
            workers: "65"
            leak: "65"
          - case: "zero-padded workers"
            workers: "08"
            leak: "08"
          - case: "update without jenkins_url"
            mode: "update"
            jenkins_user: "jjb"
            jenkins_password: "S3ntinel-password"
          - case: "update without jenkins_user"
            mode: "update"
            jenkins_url: "https://jenkins.invalid"
            jenkins_password: "S3ntinel-password"
          - case: "update without jenkins_password"
            mode: "update"
            jenkins_url: "https://jenkins.invalid"
            jenkins_user: "S3ntinel-user"
          - case: "update with an http:// URL"
            mode: "update"
            jenkins_url: "http://S3ntinel.invalid"
            jenkins_user: "jjb"
            jenkins_password: "S3ntinel-password"
          - case: "update with a URL without a host"
            mode: "update"
            jenkins_url: "https:///S3ntinel"
            jenkins_user: "jjb"
            jenkins_password: "S3ntinel-password"
          - case: "update with an empty host and a port"
            mode: "update"
            jenkins_url: "https://:443/S3ntinel"
            jenkins_user: "jjb"
            jenkins_password: "S3ntinel-password"
          - case: "update with an empty host and a query"
            mode: "update"
            jenkins_url: "https://?S3ntinel"
            jenkins_user: "jjb"
            jenkins_password: "S3ntinel-password"
          - case: "update with an empty host and a fragment"
            mode: "update"
            jenkins_url: "https://#S3ntinel"
            jenkins_user: "jjb"
            jenkins_password: "S3ntinel-password"
          - case: "update with a port above 65535"
            mode: "update"
            jenkins_url: "https://S3ntinel.invalid:65536"
            jenkins_user: "jjb"
            jenkins_password: "S3ntinel-password"
          - case: "update with user info in the URL"
            mode: "update"
            jenkins_url: "https://S3ntinel@jenkins.invalid"
            jenkins_user: "jjb"
            jenkins_password: "S3ntinel-password"
          - case: "update with a bracketed IPv6 loopback"
            mode: "update"
            jenkins_url: "https://[::1]:8443/S3ntinel/"
            jenkins_user: "jjb"
            jenkins_password: "S3ntinel-password"
          - case: "update with a bracketed IPv6 address"
            mode: "update"
            jenkins_url: "https://[2001:db8::1]/S3ntinel"
            jenkins_user: "jjb"
            jenkins_password: "S3ntinel-password"
          - case: "update with a malformed IPv6 literal ':::'"
            mode: "update"
            jenkins_url: "https://[:::]/S3ntinel"
            jenkins_user: "jjb"
            jenkins_password: "S3ntinel-password"
          - case: "update with a short IPv6 literal"
            mode: "update"
            jenkins_url: "https://[1:2:3]/S3ntinel"
            jenkins_user: "jjb"
            jenkins_password: "S3ntinel-password"
          - case: "update with a password spanning lines"
            mode: "update"
            jenkins_url: "https://jenkins.invalid"
            jenkins_user: "jjb"
            jenkins_password: "S3ntinel\nsecond-line"
          - case: "update with a padded password"
            mode: "update"
            jenkins_url: "https://jenkins.invalid"
            jenkins_user: "jjb"
            jenkins_password: " S3ntinel "
          - case: "update with a password padded by non-breaking spaces"
            mode: "update"
            jenkins_url: "https://jenkins.invalid"
            jenkins_user: "jjb"
            jenkins_password: "\u00a0S3ntinel\u00a0"
          - case: "update with a user ending in an ideographic space"
            mode: "update"
            jenkins_url: "https://jenkins.invalid"
            jenkins_user: "S3ntinel-user\u3000"
            jenkins_password: "jjb-password"
    env:
      INPUT_MODE: ${{ matrix.mode || 'test' }}
      INPUT_PATH_PREFIX: >-
        ${{ matrix.path_prefix || 'tests/fixtures/ci-management' }}
      INPUT_JJB_PATH: ${{ matrix.jjb_path || 'jjb' }}
      INPUT_JENKINS_URL: ${{ matrix.jenkins_url }}
      INPUT_JENKINS_USER: ${{ matrix.jenkins_user }}
      INPUT_JENKINS_PASSWORD: ${{ matrix.jenkins_password }}
      INPUT_DELETE_OLD: ${{ matrix.delete_old || 'true' }}
      INPUT_WORKERS: ${{ matrix.workers || '0' }}
      LEAK: ${{ matrix.leak || 'S3ntinel' }}
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run the action [expected failure]"
        id: action
        continue-on-error: true
        uses: $/
        with:
          mode: ${{ env.INPUT_MODE }}
          path_prefix: ${{ env.INPUT_PATH_PREFIX }}
          jjb_path: ${{ env.INPUT_JJB_PATH }}
          jenkins_url: ${{ env.INPUT_JENKINS_URL }}
          jenkins_user: ${{ env.INPUT_JENKINS_USER }}
          jenkins_password: ${{ env.INPUT_JENKINS_PASSWORD }}
          delete_old: ${{ env.INPUT_DELETE_OLD }}
          workers: ${{ env.INPUT_WORKERS }}

      # The action's log cannot be read back, so run the validator on
      # the same inputs to check the reason and that nothing leaks.
      - name: "Check the rejection"
        shell: bash
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          # Check the rejection
          if [ "$OUTCOME" != failure ]; then
            echo "::error::The action accepted the input"
            exit 1
          fi
          if out=$(bash scripts/validate.sh 2>&1); then
            echo "::error::validate.sh accepted the input"
            exit 1
          fi
          printf '%s\n' "$out"
          if [[ $out == *"$LEAK"* ]]; then
            echo "::error::The rejection message echoes the value"
            exit 1
          fi
          if [ -d "$RUNNER_TEMP/jjb-action-venv" ]; then
            echo "::error::The action ran past validation"
            exit 1
          fi
          echo "Rejected before anything ran, without echoing it ✅"
